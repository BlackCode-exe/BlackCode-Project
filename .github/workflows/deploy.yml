name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          secrets: |
            ADMIN_PASSWORD
            SECRET_KEY
            SEED_AUTH_KEY
            LOGS_PASSWORD
            KEYSEED_RAW
            GA4_MEASUREMENT_ID
            GA4_API_SECRET
        env:
          ADMIN_PASSWORD: ${{ secrets.CF_ADMIN_PASSWORD }}
          SECRET_KEY: ${{ secrets.CF_SECRET_KEY }}
          SEED_AUTH_KEY: ${{ secrets.CF_SEED_AUTH_KEY }}
          LOGS_PASSWORD: ${{ secrets.CF_LOGS_PASSWORD }}
          KEYSEED_RAW: ${{ secrets.CF_KEYSEED_RAW }}
          GA4_MEASUREMENT_ID: ${{ secrets.CF_GA4_MEASUREMENT_ID }}
          GA4_API_SECRET: ${{ secrets.CF_GA4_API_SECRET }}
